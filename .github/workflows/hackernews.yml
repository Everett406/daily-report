name: 🚀 Hacker News 精选

on:
  schedule:
    # 北京时间每天早上 8:00
    # UTC 00:00 = 北京时间 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      create_issue:
        description: '是否创建 Issue 通知'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  issues: write

concurrency:
  group: hackernews
  cancel-in-progress: false

jobs:
  generate-hn-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests --quiet

      - name: Generate Hacker News report
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://yunwu.ai/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gemini-3-pro-preview' }}
        run: python hackernews.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HACKERNEWS.md
          git diff --staged --quiet || git commit -m "🚀 Hacker News 精选更新: $(date +%Y-%m-%d)"
          git push

      - name: Create Issue with summary
        if: github.event.inputs.create_issue != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('HACKERNEWS.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            
            // 提取 Top 5 的标题和链接
            const top5Match = content.match(/## 🔥 热门 Top 5([\s\S]*?)(?=---\n\n## 📂)/);
            let top5Summary = '';
            if (top5Match) {
              const lines = top5Match[1].split('\n').filter(line => line.trim().startsWith('###'));
              top5Summary = lines.slice(0, 5).map(line => {
                const match = line.match(/### \d+\. \[(.*?)\]\((.*?)\)/);
                if (match) {
                  return `- [${match[1]}](${match[2]})`;
                }
                return '';
              }).filter(Boolean).join('\n');
            }
            
            // 构建简洁的 Issue 内容（数组 join，避免 YAML 多行块问题）
            const issueBody = [
              '## 🚀 今日 Hacker News 精选',
              '',
              top5Summary,
              '',
              '---',
              '',
              `📄 [查看完整报告](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/HACKERNEWS.md)`,
              '',
              `⏰ 更新时间: ${new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })}`
            ].join('\n');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚀 HN 精选 | ${date}`,
              body: issueBody,
              labels: ['hackernews', 'daily']
            });
            
            console.log('Issue created successfully!');

name: 🐾 GitHub Pet

on:
  schedule:
    # 北京时间每天 22:00 和 06:00 运行两次
    # UTC 14:00 = 北京时间 22:00
    # UTC 22:00 = 北京时间 06:00
    - cron: '0 14,22 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  feed-pet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史来获取 commit 数量

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install PyGithub requests --quiet

      - name: Feed and update pet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python pet.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PET.md pet.json
          git diff --staged --quiet || git commit -m "🐾 喂养宠物: $(date +%Y-%m-%d %H:%M)"
          git push

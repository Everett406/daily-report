name: 🎲 有趣语录推送

on:
  schedule:
    # 北京时间每天 4 次：09:30 / 12:30 / 15:30 / 21:30
    # 对应 UTC 01:30 / 04:30 / 07:30 / 13:30
    - cron: '30 1,4,7,13 * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: fun-quotes
  cancel-in-progress: false

jobs:
  push-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Push fun quote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python fun-quotes.py
